<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    SCAFFOLD — a 1024 icon with a complete lighting rig already wired.
    Copy it, rename the ids you touch, replace the GLYPH block, then re-tune the colours.
    Layers, bottom to top:
      1. bg          full-bleed base gradient (never leave corners transparent: iOS paints them black)
      2. glow        soft light source behind the glyph (top-centre); sells depth cheaply
      3. groundShade darker vignette at the bottom; keeps the eye on the glyph
      4. GLYPH       the one idea. Drawn as paths. Has: fill gradient, inner shadow, contact shadow, rim highlight
      5. sheen       a diagonal translucent sweep across the whole tile (glass feel) — keep it subtle
      6. grain       optional film grain; removes the "vector clip-art" plasticity
    Light comes from the top-left. Keep it consistent across every element.
  -->
  <defs>
    <!-- 1. base: shift the HUE between stops, not only the lightness, or the gradient looks muddy -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0"   stop-color="#5E8BFF"/>
      <stop offset="1"   stop-color="#2436C9"/>
    </linearGradient>
    <!-- 2. light source behind the glyph -->
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.55">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 3. bottom vignette -->
    <linearGradient id="groundShade" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <!-- 4a. glyph fill: white that picks up a little of the background hue at the bottom -->
    <linearGradient id="glyphFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E3FF"/>
    </linearGradient>
    <!-- 4b. contact shadow: soft, offset downward, coloured by the background not pure black -->
    <filter id="contactShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0A1B6E" flood-opacity="0.45"/>
    </filter>
    <!-- 4c. inner shadow: gives a flat shape thickness. Apply to the glyph shape itself. -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="10"/>
      <feGaussianBlur stdDeviation="12" result="ob"/>
      <feComposite operator="out" in="SourceGraphic" in2="ob" result="inv"/>
      <feFlood flood-color="#1A2A8C" flood-opacity="0.55" result="col"/>
      <feComposite operator="in" in="col" in2="inv" result="sh"/>
      <feComposite operator="over" in="sh" in2="SourceGraphic"/>
    </filter>
    <!-- 4d. rim light: a thin bright edge along the top-left of the glyph -->
    <linearGradient id="rim" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 5. sheen sweep -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.5"  stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 6. grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
    </filter>
    <!-- a soft blur for glows behind objects -->
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <!-- 1–3 background stack -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#groundShade)"/>

  <!-- 4 GLYPH — replace everything inside this group. Keep it within roughly x,y 200..824. -->
  <g id="glyph" filter="url(#contactShadow)">
    <!-- placeholder: a rounded "paper plane" style wedge so the rig can be previewed -->
    <path id="shape" filter="url(#innerShadow)" fill="url(#glyphFill)"
          d="M236 512 L784 262 L646 762 L538 586 Z"/>
    <!-- rim: same path, stroked, clipped to the top-left by the gradient -->
    <path d="M236 512 L784 262 L646 762 L538 586 Z" fill="none" stroke="url(#rim)" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- 5 sheen -->
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <!-- 6 grain (overlay blend so it darkens and lightens evenly) -->
  <rect width="1024" height="1024" filter="url(#grain)" style="mix-blend-mode:overlay"/>
</svg>
