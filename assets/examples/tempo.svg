    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C2FF4"/><stop offset="1" stop-color="#4A20D8"/>
    </linearGradient>
    <mask id="slot" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <line x1="486.0" y1="674.0" x2="791.6" y2="253.3" stroke="#000" stroke-width="64" stroke-linecap="round"/>
    </mask>
    <mask id="outside" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M433.7 194.0 L538.3 194.0 A32 32 0 0 1 568.5 215.4 L756.0 747.4 A32 32 0 0 1 725.8 790.0 L246.2 790.0 A32 32 0 0 1 216.0 747.4 L403.5 215.4 A32 32 0 0 1 433.7 194.0 Z" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <path d="M433.7 194.0 L538.3 194.0 A32 32 0 0 1 568.5 215.4 L756.0 747.4 A32 32 0 0 1 725.8 790.0 L246.2 790.0 A32 32 0 0 1 216.0 747.4 L403.5 215.4 A32 32 0 0 1 433.7 194.0 Z" fill="#FFE53B" mask="url(#slot)"/>
  <g mask="url(#outside)" fill="#FFE53B">
    <line x1="486.0" y1="674.0" x2="791.6" y2="253.3" stroke="#FFE53B" stroke-width="64" stroke-linecap="round"/>
