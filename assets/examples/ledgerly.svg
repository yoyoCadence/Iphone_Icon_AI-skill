<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Ledgerly — personal budgeting. Style B (rendered object).
       Idea: a gold coin seen slightly from above with a rising arrow embossed — "money, going up".
       Tile is deep teal (not the finance-default green). Light: top-left. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#2F8E9A"/>
      <stop offset="1" stop-color="#0A2838"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#FFE1A3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFE1A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C98019"/>
      <stop offset="1" stop-color="#5E3104"/>
    </linearGradient>
    <linearGradient id="face" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFEDB0"/>
      <stop offset="0.5" stop-color="#F4B737"/>
      <stop offset="1" stop-color="#C47A12"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C98A1A"/>
      <stop offset="1" stop-color="#8E5206"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringHi" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#FFF6D6" stop-opacity="0"/>
    </linearGradient>
    <filter id="ao" filterUnits="userSpaceOnUse" x="-256" y="-256" width="1536" height="1536"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-256" y="-256" width="1536" height="1536"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="inner" filterUnits="userSpaceOnUse" x="-256" y="-256" width="1536" height="1536">
      <feOffset dx="-5" dy="-12"/><feGaussianBlur stdDeviation="14" result="ob"/>
      <feComposite operator="out" in="SourceGraphic" in2="ob" result="inv"/>
      <feFlood flood-color="#7A4200" flood-opacity="0.55" result="col"/>
      <feComposite operator="in" in="col" in2="inv" result="sh"/>
      <feComposite operator="over" in="sh" in2="SourceGraphic"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer>
    </filter>
    <clipPath id="faceClip"><ellipse cx="512" cy="500" rx="300" ry="246"/></clipPath>
    <path id="arrowPath" d="M372 622 L482 512 L548 578 L664 462" />
    <path id="arrowHead" d="M560 440 L674 440 L674 554" />
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(0 -16) rotate(-8 512 512)">
    <!-- ambient occlusion under the coin -->
    <ellipse cx="512" cy="800" rx="290" ry="58" fill="#041A26" opacity="0.7" filter="url(#ao)"/>
    <!-- coin thickness -->
    <ellipse cx="512" cy="544" rx="300" ry="246" fill="url(#edge)"/>
    <ellipse cx="512" cy="544" rx="300" ry="246" fill="none" stroke="#3E1F02" stroke-opacity="0.35" stroke-width="3"/>
    <!-- face -->
    <ellipse cx="512" cy="500" rx="300" ry="246" fill="url(#face)" filter="url(#inner)"/>
    <!-- form shading: darker crescent bottom-right -->
    <ellipse cx="610" cy="600" rx="330" ry="270" fill="#8A4A05" opacity="0.38" clip-path="url(#faceClip)" filter="url(#soft)"/>
    <!-- inner ring (engraved) -->
    <ellipse cx="512" cy="506" rx="244" ry="196" fill="none" stroke="#9E6210" stroke-opacity="0.55" stroke-width="12"/>
    <ellipse cx="512" cy="500" rx="244" ry="196" fill="none" stroke="url(#ringHi)" stroke-width="6"/>
    <!-- embossed rising arrow: highlight copy, shadow copy, body -->
    <g fill="none" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(-4 -4)" stroke="#FFF4CF" opacity="0.9"><use href="#arrowPath"/><use href="#arrowHead"/></g>
      <g transform="translate(4 5)" stroke="#6E3A03" opacity="0.75"><use href="#arrowPath"/><use href="#arrowHead"/></g>
      <g stroke="url(#arrow)"><use href="#arrowPath"/><use href="#arrowHead"/></g>
    </g>
    <!-- rim light + specular -->
    <ellipse cx="512" cy="500" rx="297" ry="243" fill="none" stroke="url(#rim)" stroke-width="8"/>
    <ellipse cx="392" cy="372" rx="118" ry="46" fill="#FFFFFF" opacity="0.5" transform="rotate(-28 392 372)" filter="url(#soft)"/>
  </g>

  <rect width="1024" height="1024" fill="url(#vignette)"/>
  <rect width="1024" height="1024" filter="url(#grain)" style="mix-blend-mode:overlay"/>
</svg>
