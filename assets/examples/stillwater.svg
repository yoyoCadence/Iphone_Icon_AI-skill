<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Stillwater — meditation timer. Style C (liquid glass).
       Idea: two overlapping glass "ripple" panes with one still point at the centre of the larger —
       calm, layered, lit from within. Blurred colour under the glass is what makes it this app's. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#2E3272"/>
      <stop offset="1" stop-color="#111433"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="plateSmall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="105"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0B0E2E" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="pointGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
    </filter>
    <circle id="big" cx="470" cy="548" r="256"/>
    <circle id="small" cx="650" cy="398" r="152"/>
  </defs>

  <rect width="1024" height="1024" fill="url(#base)"/>
  <!-- colour under the glass -->
  <circle cx="300" cy="340" r="250" fill="#FF8FC8" filter="url(#blob)" opacity="0.9"/>
  <circle cx="730" cy="420" r="270" fill="#6D7CFF" filter="url(#blob)" opacity="0.95"/>
  <circle cx="520" cy="820" r="250" fill="#4FE3C8" filter="url(#blob)" opacity="0.85"/>

  <!-- big pane -->
  <g filter="url(#shadow)">
    <use href="#big" fill="url(#plate)" stroke="url(#edge)" stroke-width="5"/>
  </g>
  <use href="#big" transform="translate(10 12)" fill="#C8D4FF" opacity="0.16"/>
  <path d="M292 452 A256 256 0 0 1 560 302" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="7" stroke-linecap="round" filter="url(#soft)"/>

  <!-- small pane, stacked over the big one -->
  <g filter="url(#shadow)">
    <use href="#small" fill="url(#plateSmall)" stroke="url(#edge)" stroke-width="5"/>
  </g>
  <use href="#small" transform="translate(8 10)" fill="#FFE1F3" opacity="0.18"/>
  <path d="M540 336 A152 152 0 0 1 700 254" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round" filter="url(#soft)"/>

  <!-- the still point -->
  <circle cx="470" cy="548" r="40" fill="#FFFFFF" opacity="0.7" filter="url(#pointGlow)"/>
  <circle cx="470" cy="548" r="24" fill="#FFFFFF"/>

  <rect width="1024" height="1024" fill="url(#vignette)"/>
  <rect width="1024" height="1024" filter="url(#grain)" style="mix-blend-mode:overlay"/>
</svg>
