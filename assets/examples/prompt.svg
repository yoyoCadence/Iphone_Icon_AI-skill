<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Prompt — a terminal / developer tool. Style E (luminous).
       Idea: the prompt chevron as a glowing wedge with a warm block cursor — "ready for input".
       Dark navy tile (never pure black); cyan glow; one warm accent. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#1F2A5E"/>
      <stop offset="1" stop-color="#090D22"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.42" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38D6FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38D6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AF6FF"/>
      <stop offset="1" stop-color="#2FC4E8"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9B74"/>
      <stop offset="1" stop-color="#F0583A"/>
    </linearGradient>
    <filter id="glowTight" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glowWide" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="52"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
    </filter>
    <path id="chevron" d="M300 338 L532 512 L300 686" fill="none" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
    <rect id="block" x="590" y="608" width="158" height="78" rx="18"/>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#haze)"/>

  <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
    <!-- chevron: wide glow, tight glow, body, hot core -->
    <use href="#chevron" stroke="#38D6FF" filter="url(#glowWide)" opacity="0.6"/>
    <use href="#chevron" stroke="#5EF1FF" filter="url(#glowTight)" opacity="0.9"/>
    <use href="#chevron" stroke="url(#chev)"/>
    <path d="M300 338 L532 512 L300 686" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <!-- cursor block: glow, body, top highlight -->
    <use href="#block" fill="#FF7A59" filter="url(#glowWide)" opacity="0.7"/>
    <use href="#block" fill="#FF8A66" filter="url(#glowTight)" opacity="0.9"/>
    <use href="#block" fill="url(#cursor)"/>
    <rect x="604" y="618" width="130" height="22" rx="11" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <rect width="1024" height="1024" fill="url(#vignette)"/>
  <rect width="1024" height="1024" filter="url(#grain)" style="mix-blend-mode:overlay"/>
</svg>
