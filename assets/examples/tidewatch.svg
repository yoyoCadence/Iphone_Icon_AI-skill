<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Tidewatch — surf & tide forecasts. Style G (horizon scene) with a rendered wave.
       Idea: one wave at the moment of breaking, backlit by a low sun. Light source = the sun (top-right, behind). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="0.6">
      <stop offset="0" stop-color="#2A1D5C"/>
      <stop offset="0.55" stop-color="#C44A7E"/>
      <stop offset="1" stop-color="#FFB36B"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="760" cy="360" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEBB5" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#FFB36B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB36B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E9FD0"/>
      <stop offset="1" stop-color="#0A3C66"/>
    </linearGradient>
    <linearGradient id="body" x1="0.55" y1="0.3" x2="0.45" y2="1">
      <stop offset="0" stop-color="#6FE6E0"/>
      <stop offset="0.32" stop-color="#1F9DCB"/>
      <stop offset="1" stop-color="#072A4C"/>
    </linearGradient>
    <linearGradient id="lipLine" x1="400" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7EC" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFF7EC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF7EC" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3B8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFE3B8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFE3B8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0.6" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="softer" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="spray" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer>
    </filter>
    <path id="wave" d="M-20 840 C140 820 300 700 400 540 C470 430 520 350 590 320 C690 280 790 340 800 440 C810 530 770 610 700 622 C656 630 626 604 640 572 C632 660 770 730 1044 760 L1044 1044 L-20 1044 Z"/>
    <clipPath id="waveClip"><use href="#wave"/></clipPath>
  </defs>

  <!-- sky, sun, horizon haze -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#sunGlow)"/>
  <circle cx="760" cy="360" r="150" fill="#FFF3D2"/>
  <circle cx="760" cy="360" r="190" fill="#FFE2A6" opacity="0.5" filter="url(#softer)"/>

  <!-- sea behind the wave, with the sun's reflection -->
  <rect x="0" y="600" width="1024" height="424" fill="url(#sea)"/>
  <ellipse cx="760" cy="700" rx="60" ry="170" fill="#FFD9A0" opacity="0.7" filter="url(#softer)"/>
  <rect x="0" y="560" width="1024" height="90" fill="url(#haze)"/>

  <!-- the wave -->
  <use href="#wave" fill="url(#body)"/>
  <!-- barrel shadow inside the tube -->
  <ellipse cx="766" cy="662" rx="118" ry="48" fill="#041F3A" opacity="0.8" transform="rotate(-14 766 662)" clip-path="url(#waveClip)" filter="url(#soft)"/>
  <!-- thin lit edge on the underside of the lip, so the hook reads as a hook -->
  <path d="M800 440 C810 530 770 610 700 622" fill="none" stroke="#BDF3F0" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
  <!-- translucent lit crest (sun shining through the lip) -->
  <path d="M560 330 C660 290 760 330 790 430 C740 380 660 350 580 370 Z" fill="#9FF2E8" opacity="0.55" filter="url(#soft)" clip-path="url(#waveClip)"/>
  <!-- foam line along the lip -->
  <path d="M400 540 C470 430 520 350 590 320 C690 280 790 340 800 440" fill="none" stroke="url(#lipLine)" stroke-width="22" stroke-linecap="round"/>
  <!-- spray at the lip tip -->
  <g fill="#FFF7EC" filter="url(#spray)">
    <circle cx="646" cy="566" r="30" opacity="0.95"/>
    <circle cx="600" cy="600" r="20" opacity="0.8"/>
    <circle cx="566" cy="578" r="12" opacity="0.7"/>
    <circle cx="690" cy="600" r="14" opacity="0.6"/>
  </g>
  <!-- whitewater at the foot -->
  <ellipse cx="900" cy="770" rx="170" ry="24" fill="#DDF3FF" opacity="0.35" filter="url(#soft)"/>

  <rect width="1024" height="1024" fill="url(#vignette)"/>
  <rect width="1024" height="1024" filter="url(#grain)" style="mix-blend-mode:overlay"/>
</svg>
