<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小帳本 — 簡單記帳</title>
  <meta name="theme-color" content="#1F6F7A">
  <style>
    :root { --brand: #1F6F7A; --accent: #F4B737; --bg: #F7F6F2; }
    body { margin: 0; font-family: -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: #1d1d1f; }
    header { background: var(--brand); color: #fff; padding: 20px 16px; }
    .total { font-size: 40px; font-weight: 700; }
    .btn { background: var(--accent); color: #3a2a00; border-radius: 12px; padding: 12px 16px; display: inline-block; }
  </style>
</head>
<body>
  <header><div>本月支出</div><div class="total">NT$ 12,480</div></header>
  <main>
    <p>每天 10 秒記一筆，月底自動分析預算。</p>
    <a class="btn" href="#add">新增一筆</a>
  </main>
</body>
</html>
